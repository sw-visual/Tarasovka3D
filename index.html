<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Тарасовка.3D</title>
  <script src="babylon.js"></script>
  <script src="babylonjs.loaders.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", Arial, sans-serif; }
    #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    #modelInfo {
      position: fixed; right: 16px; top: 14px; text-align: right;
      pointer-events: none; user-select: none;
    }
    #modelInfo .title { color: #de6223; font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    #modelInfo .line  { color: #9aa0a6; font-size: 12px; line-height: 1.4; }
    #modelInfo .line2 { color: #ccd4db; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <!-- <div id="modelInfo"> -->
    <!-- <div class="title">Тарасовка</div> -->
    <!-- <div class="line">Архитектурно-градостроительная концепция</div> -->
    <!-- <div class="line2">Земельный участок = 7га</div> -->
    <!-- <div class="line2">Площадь жилого фонда = 58 220 м²</div> -->
  <!-- </div> -->
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);

    // ---------- ФЛАГИ ----------
    const USE_SSAO = false;   // true включает экранный AO (тяжелее для телефона)

    // ---------- БЛОКИРОВКА ПКМ-ЖЕСТОВ ----------
    canvas.addEventListener("contextmenu", e => e.preventDefault());
    canvas.addEventListener("mousedown", e => { if (e.button === 2) e.preventDefault(); }, true);

    // ---------- НАПРАВЛЕНИЕ СОЛНЦА ----------
    const sunDirection = new BABYLON.Vector3(0.7, 0.5, 0.5).normalize();

    // ---------- ГРАДИЕНТНОЕ ОКРУЖЕНИЕ ДЛЯ ОТРАЖЕНИЙ ----------
    BABYLON.Effect.ShadersStore["skyVertexShader"] = `
      precision highp float;
      attribute vec3 position;
      uniform mat4 worldViewProjection;
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = worldViewProjection * vec4(position, 1.0);
      }`;

    BABYLON.Effect.ShadersStore["skyFragmentShader"] = `
      precision highp float;
      varying vec3 vPos;
      uniform vec3 sunDir;

      void main() {
        vec3 d = normalize(vPos);
        float h = d.y;                                   // -1 низ, 1 верх

        // Верхняя полусфера (небо): как и раньше
        vec3 horizon = vec3(0.45, 0.48, 0.52);
        vec3 zenith  = vec3(0.92, 0.96, 1.00);
        vec3 col = mix(horizon, zenith, smoothstep(0.0, 0.9, h));

        // Нижняя полусфера: у горизонта черный, как и было
        vec3 nadirBlack = vec3(0.0, 0.0, 0.0);
        vec3 groundGrey = vec3(0.55, 0.56, 0.58);        // светло-серая земля
        // Угол взгляда вниз от горизонта: 0 у горизонта, 1 строго вниз
        // 50 градусов вниз от горизонта соответствует h = -sin(50°) ≈ -0.766
        float down = clamp(-h, 0.0, 1.0);
        // Чёрный держится до ~ 0.0, серый появляется примерно с 50 градусов
        float greyMix = smoothstep(0.55, 0.77, down);
        vec3 ground = mix(nadirBlack, groundGrey, greyMix);

        // Переход горизонт: ниже горизонта берём землю, выше - небо
        col = mix(ground, col, smoothstep(-0.05, 0.25, h));

        // Оттяжка у горизонта
        float band = exp(-pow((h - 0.15) * 3.5, 2.0));
        col += vec3(0.35, 0.38, 0.42) * band;

        // Противоположная от солнца полусфера
        float opp = max(dot(d, -normalize(sunDir)), 0.0);
        col += vec3(0.20, 0.22, 0.26) * pow(opp, 2.0);

        // Рассеянное солнце
        float s = max(dot(d, normalize(sunDir)), 0.0);
        col += vec3(1.00, 0.97, 0.90) * pow(s, 4.0)  * 0.55;
        col += vec3(1.00, 0.98, 0.95) * pow(s, 32.0) * 1.20;

        gl_FragColor = vec4(col, 1.0);
      }`;

    const sky = BABYLON.MeshBuilder.CreateSphere("sky", {
      diameter: 1000,
      sideOrientation: BABYLON.Mesh.BACKSIDE
    }, scene);
    const skyMat = new BABYLON.ShaderMaterial("skyMat", scene, "sky", {
      attributes: ["position"],
      uniforms: ["worldViewProjection", "sunDir"]
    });
    skyMat.setVector3("sunDir", sunDirection);
    sky.material = skyMat;
    sky.layerMask = 0x10000000;
    sky.isPickable = false;

    // ---------- КАМЕРА ----------
    const camera = new BABYLON.ArcRotateCamera(
      "cam", -Math.PI / 4, Math.PI / 3.2, 50, BABYLON.Vector3.Zero(), scene
    );
    camera.attachControl(canvas, true);
    camera.layerMask = 0x0FFFFFFF;

    camera.angularSensibilityX = 1000;
    camera.angularSensibilityY = 1000;
    camera.panningSensibility = 50;
    camera.inputs.attached.pointers.buttons = [0, 1, 2];
    camera.inputs.attached.pointers.panningMouseButton = 2;
    camera.wheelPrecision = 2;
    camera.pinchPrecision = 20;

    // ---------- СВЕТ И ТЕНИ ----------
    const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 0.25;

    const sun = new BABYLON.DirectionalLight("sun", sunDirection.scale(-1), scene);
    sun.intensity = 8.0;

    const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
    shadowGen.useBlurExponentialShadowMap = false;
    shadowGen.usePercentageCloserFiltering = true;
    shadowGen.filteringQuality = BABYLON.ShadowGenerator.QUALITY_HIGH;
    shadowGen.bias = 0.0005;
    shadowGen.normalBias = 0.02;
    shadowGen.darkness = 0.25;

    // ---------- ЗАГРУЗКА МОДЕЛИ ----------
    BABYLON.SceneLoader.Append("./", "Tarasovka_3Dmaket.glb", scene, () => {
      let min = new BABYLON.Vector3(Infinity, Infinity, Infinity);
      let max = new BABYLON.Vector3(-Infinity, -Infinity, -Infinity);
      const modelMeshes = scene.meshes.filter(m => m !== sky && m.isVisible && m.getTotalVertices() > 0);

      modelMeshes.forEach(mesh => {
        mesh.computeWorldMatrix(true);
        const bb = mesh.getBoundingInfo().boundingBox;
        min = BABYLON.Vector3.Minimize(min, bb.minimumWorld);
        max = BABYLON.Vector3.Maximize(max, bb.maximumWorld);
        shadowGen.addShadowCaster(mesh);
        mesh.receiveShadows = true;
      });

      const center = BABYLON.Vector3.Center(min, max);
      const radius = max.subtract(min).length() / 2;

      // Солнце охватывает всю модель
      sun.position = center.add(sunDirection.scale(radius * 3));
      sun.shadowMinZ = radius * 0.1;
      sun.shadowMaxZ = radius * 8;
      sun.orthoLeft = -radius * 1.5;
      sun.orthoRight = radius * 1.5;
      sun.orthoBottom = -radius * 1.5;
      sun.orthoTop = radius * 1.5;

      // Стартовая камера
      const cameraHeight = 2;
      camera.setTarget(center);
      const dist = radius * 2.2;
      camera.alpha = -Math.PI / 4;
      camera.beta = Math.PI / 2 - Math.atan2(cameraHeight, dist);
      camera.radius = dist;
      camera.lowerRadiusLimit = radius * 0.05;
      camera.upperRadiusLimit = radius * 10;
      camera.minZ = radius / 100;
      camera.maxZ = radius * 100;

      sky.position = center.clone();

      // Отражения: окружение из градиентного неба и земли
      const probe = new BABYLON.ReflectionProbe("probe", 256, scene);
      probe.position = center.clone();
      probe.renderList.push(sky);
      scene.environmentTexture = probe.cubeTexture;
      scene.environmentIntensity = 1.1;

      // ---------- AO (опционально) ----------
      if (USE_SSAO) {
        const ssao = new BABYLON.SSAO2RenderingPipeline("ssao", scene, { ssaoRatio: 0.5, blurRatio: 0.5 });
        ssao.radius = radius * 0.5;          // радиус затемнения в мировых единицах модели
        ssao.totalStrength = 12.2;
        ssao.base = 0.2;
        scene.postProcessRenderPipelineManager.attachCamerasToRenderPipeline("ssao", camera);
      }
    });
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
